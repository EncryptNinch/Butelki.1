<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ColorSort</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #F5F3EF;
  --surface: #FFFFFF;
  --border: #E8E4DC;
  --text: #1A1A2E;
  --text2: #8A8A9A;
  --accent: #FF5A5F;
  --accent2: #FFB347;
  --radius: 999px;
  --shadow: 0 4px 20px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
}

body {
  font-family: 'Nunito Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

/* subtle dot pattern on background */
body::before {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: radial-gradient(circle, rgba(0,0,0,0.04) 1px, transparent 1px);
  background-size: 24px 24px;
}

/* ─── HEADER ─────────────────────────────────────────────────────────────── */
header {
  position: relative; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px;
  background: var(--surface);
  border-bottom: 2px solid var(--border);
  box-shadow: 0 2px 12px rgba(0,0,0,0.05);
}

.logo {
  font-family: 'Nunito', sans-serif;
  font-size: 1.5rem;
  font-weight: 900;
  color: var(--text);
  letter-spacing: -0.5px;
}
.logo span { color: var(--accent); }

.stats { display: flex; gap: 8px; }
.stat {
  background: var(--bg);
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 4px 14px;
  text-align: center;
  font-size: .6rem;
  font-weight: 700;
  color: var(--text2);
  letter-spacing: .8px;
  text-transform: uppercase;
}
.stat b { display: block; font-size: .95rem; font-weight: 900; color: var(--text); margin-top: 1px; }

.hbtns { display: flex; gap: 8px; }

button {
  font-family: 'Nunito', sans-serif;
  cursor: pointer; border: none;
  border-radius: 12px;
  padding: 8px 16px;
  font-weight: 800; font-size: .82rem;
  transition: .15s all;
}
button:active { transform: scale(.93); }

.bp {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 4px 14px rgba(255,90,95,.35);
}
.bp:hover { box-shadow: 0 6px 20px rgba(255,90,95,.5); transform: translateY(-1px); }

.bg2 {
  background: var(--surface);
  color: var(--text);
  border: 2px solid var(--border);
}
.bg2:hover { background: var(--bg); border-color: #d0ccC4; }

/* ─── MAIN ───────────────────────────────────────────────────────────────── */
main {
  position: relative; z-index: 1; flex: 1;
  display: flex; flex-direction: column; align-items: center;
  padding: 28px 16px 100px;
}

.lvlbadge {
  font-family: 'Nunito', sans-serif;
  font-size: .75rem; font-weight: 900;
  letter-spacing: 2.5px; text-transform: uppercase;
  color: var(--text2);
  margin-bottom: 24px;
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 999px;
  padding: 5px 18px;
}

/* ─── GRID ───────────────────────────────────────────────────────────────── */
#grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 16px;
  max-width: 820px;
  width: 100%;
}

.vslot {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  user-select: none;
  position: relative;
}

.vslot canvas {
  display: block;
  transition: transform .22s cubic-bezier(.34,1.56,.64,1), filter .22s ease;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,0.10));
}
.vslot.sel canvas {
  transform: translateY(-16px);
  filter: drop-shadow(0 8px 20px rgba(255,90,95,.40));
}
.vslot.done canvas {
  filter: drop-shadow(0 4px 16px rgba(50,210,110,.45));
}

/* ─── CUSTOMIZER ─────────────────────────────────────────────────────────── */
#cust {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
  background: var(--surface);
  border-top: 2px solid var(--border);
  border-radius: 24px 24px 0 0;
  box-shadow: 0 -8px 40px rgba(0,0,0,0.10);
  padding: 16px 20px 28px;
  transform: translateY(100%);
  transition: transform .32s cubic-bezier(.34,1.2,.64,1);
  max-height: 72vh; overflow-y: auto;
}
#cust.open { transform: translateY(0); }

.ch { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.ctitle { font-family: 'Nunito', sans-serif; font-size: 1.15rem; font-weight: 900; color: var(--text); }

.csec { margin-bottom: 16px; }
.clabel {
  font-size: .6rem; font-weight: 800; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--text2); margin-bottom: 10px;
}
.copts { display: flex; gap: 8px; flex-wrap: wrap; }

.bgsw {
  width: 60px; height: 40px; border-radius: 10px; cursor: pointer;
  border: 2.5px solid transparent; transition: .18s all;
  position: relative; overflow: hidden; flex-shrink: 0;
}
.bgsw.on { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,90,95,.2); }
.bgsw:hover { transform: scale(1.06); }
.bgsw span {
  position: absolute; bottom: 2px; left: 0; right: 0;
  text-align: center; font-size: .52rem; font-weight: 800;
  color: rgba(255,255,255,.95); text-shadow: 0 1px 3px rgba(0,0,0,.6);
}

.shsw {
  width: 54px; border-radius: 12px; cursor: pointer;
  padding: 8px 5px 6px;
  border: 2.5px solid var(--border); background: var(--bg);
  transition: .18s all;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
}
.shsw.on { border-color: var(--accent); background: rgba(255,90,95,.06); }
.shsw:hover { border-color: #ccc; }
.shsw span { font-size: .54rem; font-weight: 700; color: var(--text2); }

.tintd {
  width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
  border: 3px solid transparent; transition: .18s all;
  box-shadow: var(--shadow);
}
.tintd.on { border-color: var(--text); transform: scale(1.15); }

.slrow { display: flex; align-items: center; gap: 12px; }
input[type=range] {
  -webkit-appearance: none; flex: 1; height: 6px;
  border-radius: 3px; background: var(--border); outline: none; cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 2px 8px rgba(255,90,95,.4); cursor: pointer;
}
.slv { font-weight: 800; font-size: .8rem; min-width: 28px; text-align: right; color: var(--text2); }

/* ─── WIN ────────────────────────────────────────────────────────────────── */
#win {
  display: none; position: fixed; inset: 0;
  background: rgba(245,243,239,.82); backdrop-filter: blur(8px);
  z-index: 100; flex-direction: column; align-items: center; justify-content: center;
}
#win.on { display: flex; }

.wcard {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 28px;
  padding: 40px 52px;
  text-align: center;
  box-shadow: var(--shadow-lg);
  animation: pop .45s cubic-bezier(.34,1.56,.64,1);
}
@keyframes pop { from{transform:scale(.5);opacity:0} to{transform:scale(1);opacity:1} }

.wemj { font-size: 3.5rem; }
.wtit {
  font-family: 'Nunito', sans-serif;
  font-size: 2rem; font-weight: 900;
  color: var(--text); margin: 8px 0 4px;
}
.wsub { color: var(--text2); font-size: .9rem; font-weight: 600; margin-bottom: 24px; }
.wbtns { display: flex; gap: 10px; justify-content: center; }

.cfx { position: fixed; inset: 0; pointer-events: none; z-index: 99; overflow: hidden; }
.cp { position: absolute; top: -20px; animation: cfal linear forwards; }
@keyframes cfal { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }

/* ─── LEVEL SELECT ───────────────────────────────────────────────────────── */
#lsel {
  display: none; position: fixed; inset: 0;
  background: rgba(245,243,239,.88); backdrop-filter: blur(10px);
  z-index: 100; flex-direction: column; align-items: center;
  justify-content: flex-start; gap: 14px; overflow-y: auto; padding: 28px 16px;
}
#lsel.on { display: flex; }

.lsec { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; max-width: 400px; }
.lsec-label {
  font-size: .6rem; font-weight: 800; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--text2); align-self: flex-start;
}
.lgrid { display: grid; grid-template-columns: repeat(6,1fr); gap: 7px; width: 100%; }
.lbtn {
  aspect-ratio: 1; border-radius: 12px;
  background: var(--surface); border: 2px solid var(--border);
  color: var(--text); font-size: .8rem; font-weight: 800;
}
.lbtn:hover { background: var(--bg); border-color: var(--accent); color: var(--accent); }
.lbtn.cur { background: var(--accent); border-color: var(--accent); color: #fff; }
.lbtn.donel { border-color: #32D26E; color: #32D26E; }

/* ─── TOAST ──────────────────────────────────────────────────────────────── */
.toast {
  position: fixed; bottom: 90px; left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: var(--text); color: #fff;
  border-radius: 999px; padding: 9px 22px;
  font-weight: 700; font-size: .85rem;
  z-index: 200; transition: transform .28s cubic-bezier(.34,1.56,.64,1);
  pointer-events: none; white-space: nowrap;
}
.toast.on { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="logo">Color<span>Sort</span></div>
  <div class="stats">
    <div class="stat">Ruchy<b id="mc">0</b></div>
    <div class="stat">Poziom<b id="ldisp">1</b></div>
  </div>
  <div class="hbtns">
    <button class="bg2" id="undoBtn">↩ Cofnij</button>
    <button class="bg2" id="lvlBtn">📋</button>
    <button class="bg2" id="custBtn">🎨</button>
    <button class="bp"  id="rstBtn">↺ Nowa</button>
  </div>
</header>

<main>
  <div class="lvlbadge" id="lbadge">Poziom 1</div>
  <div id="grid"></div>
</main>

<canvas id="pourCv" style="position:fixed;top:0;left:0;pointer-events:none;z-index:30;"></canvas>

<!-- CUSTOMIZER -->
<div id="cust">
  <div class="ch">
    <div class="ctitle">✨ Wygląd</div>
    <button class="bg2" id="custClose" style="padding:6px 12px">✕</button>
  </div>

  <div class="csec">
    <div class="clabel">🎨 Motyw tła</div>
    <div class="copts" id="bgOpts">
      <div class="bgsw on" data-bg="light"  style="background:linear-gradient(135deg,#F5F3EF,#EAE6DC)"><span>Jasny</span></div>
      <div class="bgsw"    data-bg="dark"   style="background:linear-gradient(135deg,#1a1a2e,#0d0d1a)"><span>Ciemny</span></div>
      <div class="bgsw"    data-bg="blue"   style="background:linear-gradient(135deg,#dbeafe,#bfdbfe)"><span>Błękit</span></div>
      <div class="bgsw"    data-bg="green"  style="background:linear-gradient(135deg,#dcfce7,#bbf7d0)"><span>Zieleń</span></div>
      <div class="bgsw"    data-bg="peach"  style="background:linear-gradient(135deg,#ffedd5,#fed7aa)"><span>Brzoskw.</span></div>
    </div>
  </div>

  <div class="csec">
    <div class="clabel">🧪 Kształt naczynia</div>
    <div class="copts" id="shapeOpts"></div>
  </div>

  <div class="csec">
    <div class="clabel">📐 Rozmiar</div>
    <div class="slrow">
      <span style="font-size:.72rem;color:var(--text2)">S</span>
      <input type="range" id="szSl" min="38" max="70" value="52">
      <span style="font-size:.72rem;color:var(--text2)">L</span>
      <span class="slv" id="szV">52</span>
    </div>
  </div>
</div>

<!-- WIN -->
<div id="win">
  <div class="cfx" id="cfx"></div>
  <div class="wcard">
    <div class="wemj">🎉</div>
    <div class="wtit">Brawo!</div>
    <div class="wsub">Ukończono w <b id="wm">0</b> ruchach</div>
    <div class="wbtns">
      <button class="bg2" id="replayBtn">↺ Jeszcze raz</button>
      <button class="bp"  id="nextBtn">Następny →</button>
    </div>
  </div>
</div>

<!-- LEVEL SELECT -->
<div id="lsel">
  <div style="font-family:'Nunito',sans-serif;font-size:1.4rem;font-weight:900;margin-bottom:4px">Wybierz poziom</div>
  <div class="lsec"><div class="lsec-label">Łatwe (1–10)</div><div class="lgrid" id="lg1"></div></div>
  <div class="lsec"><div class="lsec-label">Średnie (11–20)</div><div class="lgrid" id="lg2"></div></div>
  <div class="lsec"><div class="lsec-label">Trudne (21–30)</div><div class="lgrid" id="lg3"></div></div>
  <button class="bg2" id="lsClose" style="margin-top:6px">Zamknij</button>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

// ─── PALETTE — vivid, clearly distinct colours ────────────────────────────────
const PALETTE = [
  '#FF5A5F', // coral red
  '#3B82F6', // clear blue
  '#22C55E', // green
  '#F59E0B', // amber
  '#A855F7', // purple
  '#F97316', // orange
  '#EC4899', // pink
  '#06B6D4', // cyan
  '#84CC16', // lime
  '#EF4444', // red
  '#8B5CF6', // violet
  '#14B8A6', // teal
];

const CAP = 4;
const LEVELS = [
  [3,2],[3,2],[4,2],[4,2],[4,2],
  [5,2],[5,2],[5,2],[5,2],[6,2],
  [6,2],[6,2],[6,3],[6,3],[7,2],
  [7,2],[7,3],[7,3],[8,2],[8,3],
  [8,3],[9,2],[9,3],[9,3],[10,2],
  [10,3],[10,3],[11,3],[11,3],[12,3],
];

const DPR = Math.min(window.devicePixelRatio || 1, 2);

// ─── BACKGROUNDS ─────────────────────────────────────────────────────────────
const BG_THEMES = {
  light: { bg:'#F5F3EF', dot:'rgba(0,0,0,0.04)', text:'#1A1A2E', text2:'#8A8A9A', surface:'#FFFFFF', border:'#E8E4DC' },
  dark:  { bg:'#14141F', dot:'rgba(255,255,255,0.04)', text:'#F0F0F0', text2:'#6B6B80', surface:'#1E1E2E', border:'#2A2A3E' },
  blue:  { bg:'#EFF6FF', dot:'rgba(59,130,246,0.06)', text:'#1E3A5F', text2:'#6B90B0', surface:'#FFFFFF', border:'#BFDBFE' },
  green: { bg:'#F0FDF4', dot:'rgba(34,197,94,0.06)',  text:'#14532D', text2:'#6B9E7A', surface:'#FFFFFF', border:'#BBF7D0' },
  peach: { bg:'#FFF7ED', dot:'rgba(249,115,22,0.06)', text:'#7C2D12', text2:'#B07A5A', surface:'#FFFFFF', border:'#FED7AA' },
};

// ─── VESSEL SHAPES ────────────────────────────────────────────────────────────
const SHAPES = {

  pill: {
    label: 'Probówka', emoji: '🧪',
    build(W) {
      const H = W * 3.0, R = W * 0.5; // fully rounded top and bottom
      function outline(ctx) {
        ctx.beginPath();
        ctx.moveTo(R, 0); ctx.lineTo(W - R, 0);
        ctx.arcTo(W, 0, W, R, R);
        ctx.lineTo(W, H - R);
        ctx.arcTo(W, H, W/2, H, R);
        ctx.arcTo(0, H, 0, H-R, R);
        ctx.lineTo(0, R);
        ctx.arcTo(0, 0, R, 0, R);
        ctx.closePath();
      }
      function liquidRegion(ctx, yTop) {
        ctx.beginPath(); ctx.rect(0, yTop, W, H - yTop);
      }
      return { W, H, outline, liquidRegion };
    }
  },

  round: {
    label: 'Butelka', emoji: '🍾',
    build(W) {
      const H = W * 3.2, nW = W * 0.38, nH = H * 0.18, R = W * 0.46, hw = W/2;
      function outline(ctx) {
        ctx.beginPath();
        ctx.moveTo(hw - nW/2, 0); ctx.lineTo(hw + nW/2, 0);
        ctx.bezierCurveTo(hw+nW/2, nH*.5, W*.85, nH*1.0, W-2, H-R);
        ctx.arcTo(W-2, H-2, hw, H-2, R);
        ctx.arcTo(2, H-2, 2, H-R, R);
        ctx.bezierCurveTo(W*.15, nH*1.0, hw-nW/2, nH*.5, hw-nW/2, 0);
        ctx.closePath();
      }
      function liquidRegion(ctx, yTop) {
        ctx.beginPath(); ctx.rect(0, yTop, W, H - yTop);
      }
      return { W, H, outline, liquidRegion };
    }
  },

  glass: {
    label: 'Szklanka', emoji: '🥛',
    build(W) {
      const H = W * 2.4, topW = W, botW = W * 0.70, hw = W/2, R = W * 0.12;
      function outline(ctx) {
        ctx.beginPath();
        ctx.moveTo(hw-topW/2+R, 0); ctx.lineTo(hw+topW/2-R, 0);
        ctx.arcTo(hw+topW/2, 0, hw+topW/2, R, R);
        ctx.lineTo(hw+botW/2, H-R);
        ctx.arcTo(hw+botW/2, H, hw+botW/2-R, H, R);
        ctx.lineTo(hw-botW/2+R, H);
        ctx.arcTo(hw-botW/2, H, hw-botW/2, H-R, R);
        ctx.lineTo(hw-topW/2, R);
        ctx.arcTo(hw-topW/2, 0, hw-topW/2+R, 0, R);
        ctx.closePath();
      }
      function liquidRegion(ctx, yTop) {
        ctx.beginPath(); ctx.rect(0, yTop, W, H - yTop);
      }
      return { W, H, outline, liquidRegion };
    }
  },

  wineglass: {
    label: 'Kieliszek', emoji: '🍷',
    build(W) {
      const H = W * 3.8, bH = H * 0.50, sH = H * 0.30, bsH = H * 0.07;
      const hw = W/2, bR = W * 0.45, stW = W * 0.07, baseW = W * 0.66;
      function outline(ctx) {
        ctx.beginPath();
        ctx.moveTo(hw-bR, 0); ctx.lineTo(hw+bR, 0);
        ctx.bezierCurveTo(hw+bR, bH*.65, hw+stW*2.2, bH*.96, hw+stW, bH);
        ctx.lineTo(hw+stW, bH+sH);
        ctx.lineTo(hw+baseW/2, H-bsH); ctx.lineTo(hw+baseW/2, H);
        ctx.lineTo(hw-baseW/2, H); ctx.lineTo(hw-baseW/2, H-bsH);
        ctx.lineTo(hw-stW, bH+sH); ctx.lineTo(hw-stW, bH);
        ctx.bezierCurveTo(hw-stW*2.2, bH*.96, hw-bR, bH*.65, hw-bR, 0);
        ctx.closePath();
      }
      function liquidRegion(ctx, yTop) {
        ctx.beginPath(); ctx.rect(0, yTop, W, bH - yTop);
      }
      return { W, H, outline, liquidRegion, liquidH: bH };
    }
  },

  mug: {
    label: 'Kubek', emoji: '☕',
    build(W) {
      const H = W * 2.1, R = W * 0.14;
      function outline(ctx) {
        ctx.beginPath();
        ctx.moveTo(R, 0); ctx.lineTo(W-R, 0);
        ctx.arcTo(W, 0, W, R, R); ctx.lineTo(W, H-R);
        ctx.arcTo(W, H, W-R, H, R); ctx.lineTo(R, H);
        ctx.arcTo(0, H, 0, H-R, R); ctx.lineTo(0, R);
        ctx.arcTo(0, 0, R, 0, R); ctx.closePath();
      }
      function liquidRegion(ctx, yTop) {
        ctx.beginPath(); ctx.rect(0, yTop, W, H - yTop);
      }
      function extra(ctx, theme) {
        const hx = W + W*.16, hy = H*.42, ro = W*.19, ri = W*.09;
        ctx.beginPath();
        ctx.arc(hx, hy, ro, -.5, Math.PI*.55);
        ctx.arc(hx, hy, ri, Math.PI*.55, -.5, true);
        ctx.closePath();
        ctx.fillStyle = theme.surface + 'cc'; ctx.fill();
        ctx.strokeStyle = theme.border; ctx.lineWidth = 2.5; ctx.stroke();
      }
      return { W, H, outline, liquidRegion, extra };
    }
  },

  flask: {
    label: 'Kolba', emoji: '⚗️',
    build(W) {
      const H = W * 3.1, nW = W * 0.30, nH = H * 0.27, bR = W * 0.43, hw = W/2;
      function outline(ctx) {
        ctx.beginPath();
        ctx.moveTo(hw-nW/2, 0); ctx.lineTo(hw+nW/2, 0);
        ctx.lineTo(hw+nW/2, nH);
        ctx.bezierCurveTo(hw+nW/2, nH+H*.07, hw+bR*2, nH+H*.09, hw+bR*2, H-bR);
        ctx.arcTo(hw+bR*2, H, hw, H, bR);
        ctx.arcTo(hw-bR*2, H, hw-bR*2, H-bR, bR);
        ctx.bezierCurveTo(hw-bR*2, nH+H*.09, hw-nW/2, nH+H*.07, hw-nW/2, nH);
        ctx.closePath();
      }
      function liquidRegion(ctx, yTop) {
        const bulbTop = nH + H * 0.09;
        ctx.beginPath();
        ctx.rect(0, Math.max(yTop, bulbTop), W, H - Math.max(yTop, bulbTop));
      }
      return { W, H, outline, liquidRegion };
    }
  },

  shot: {
    label: 'Shot', emoji: '🥃',
    build(W) {
      const H = W * 1.55, topW = W, botW = W * 0.72, hw = W/2, R = W * 0.1;
      function outline(ctx) {
        ctx.beginPath();
        ctx.moveTo(hw-topW/2+R, 0); ctx.lineTo(hw+topW/2-R, 0);
        ctx.arcTo(hw+topW/2, 0, hw+topW/2, R, R);
        ctx.lineTo(hw+botW/2, H-R);
        ctx.arcTo(hw+botW/2, H, hw+botW/2-R, H, R);
        ctx.lineTo(hw-botW/2+R, H);
        ctx.arcTo(hw-botW/2, H, hw-botW/2, H-R, R);
        ctx.lineTo(hw-topW/2, R);
        ctx.arcTo(hw-topW/2, 0, hw-topW/2+R, 0, R);
        ctx.closePath();
      }
      function liquidRegion(ctx, yTop) {
        ctx.beginPath(); ctx.rect(0, yTop, W, H - yTop);
      }
      return { W, H, outline, liquidRegion };
    }
  },
};

const SHAPE_KEYS = Object.keys(SHAPES);

// ─── STATE ────────────────────────────────────────────────────────────────────
let tubes=[], selected=null, moves=0, history=[], currentLevel=0;
let isAnimating = false;
const completedLevels = new Set();
let C = { bg:'light', shape:'pill', size:52 };
let THEME = BG_THEMES.light;

const vCache = {};
function getVDef() {
  const k = C.shape + '_' + C.size;
  if (!vCache[k]) vCache[k] = SHAPES[C.shape].build(C.size);
  return vCache[k];
}
function clearVCache() { for(const k in vCache) delete vCache[k]; }

function applyTheme(bgKey) {
  C.bg = bgKey;
  THEME = BG_THEMES[bgKey];
  const r = document.documentElement.style;
  r.setProperty('--bg',      THEME.bg);
  r.setProperty('--surface', THEME.surface);
  r.setProperty('--border',  THEME.border);
  r.setProperty('--text',    THEME.text);
  r.setProperty('--text2',   THEME.text2);
}

// ─── COLOUR HELPERS ───────────────────────────────────────────────────────────
function hexToRgb(hex) {
  return { r:parseInt(hex.slice(1,3),16), g:parseInt(hex.slice(3,5),16), b:parseInt(hex.slice(5,7),16) };
}
function lighten(hex, amt) {
  const {r,g,b} = hexToRgb(hex);
  return `rgb(${Math.min(255,r+amt)},${Math.min(255,g+amt)},${Math.min(255,b+amt)})`;
}
function alpha(hex, a) {
  const {r,g,b} = hexToRgb(hex);
  return `rgba(${r},${g},${b},${a})`;
}

// ─── DRAW VESSEL ──────────────────────────────────────────────────────────────
function drawVessel(tube, idx) {
  const vd = getVDef();
  const { W, H, outline, liquidH: lH, extra } = vd;
  const liquidH = lH || H;
  const isSel = selected === idx;
  const isDone = isTubeComplete(tube);

  const PAD = 14;
  const pw = W + PAD*2, ph = H + PAD*2;
  const cv = document.createElement('canvas');
  cv.width = pw * DPR; cv.height = ph * DPR;
  cv.style.width = pw + 'px'; cv.style.height = ph + 'px';
  const ctx = cv.getContext('2d');
  ctx.scale(DPR, DPR);
  ctx.translate(PAD, PAD);

  // 1. Vessel background fill
  ctx.save();
  outline(ctx); ctx.clip();
  ctx.fillStyle = THEME.surface;
  ctx.fillRect(-2, -2, W+4, H+4);
  ctx.restore();

  // 2. Liquid layers — each in its exact Y band
  for (let i = 0; i < tube.length; i++) {
    const hex = PALETTE[tube[i]];
    const yTop = liquidH * (1 - (i+1)/CAP);
    const yBot = liquidH * (1 - i/CAP);
    const bandH = yBot - yTop;
    if (bandH <= 0) continue;

    ctx.save();
    outline(ctx); ctx.clip();
    ctx.beginPath(); ctx.rect(0, yTop, W, bandH); ctx.clip();

    // Flat solid colour — clean, no gradient bleed
    ctx.fillStyle = hex;
    ctx.fillRect(0, yTop, W, bandH);

    // Subtle top sheen only (max 20% of band height)
    const sh = Math.min(6, bandH * 0.20);
    const sg = ctx.createLinearGradient(0, yTop, 0, yTop + sh);
    sg.addColorStop(0, 'rgba(255,255,255,0.28)');
    sg.addColorStop(1, 'rgba(255,255,255,0.00)');
    ctx.fillStyle = sg;
    ctx.fillRect(0, yTop, W, sh);

    ctx.restore();

    // Separator line between layers
    if (i < tube.length - 1) {
      ctx.save();
      outline(ctx); ctx.clip();
      ctx.strokeStyle = 'rgba(255,255,255,0.55)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, yTop); ctx.lineTo(W, yTop); ctx.stroke();
      ctx.restore();
    }
  }

  // 3. Vessel border
  const borderColor = isDone
    ? '#22C55E'
    : isSel
      ? '#FF5A5F'
      : THEME.border;
  const borderW = (isDone || isSel) ? 3 : 2.5;
  ctx.strokeStyle = borderColor;
  ctx.lineWidth = borderW;
  outline(ctx); ctx.stroke();

  // 4. Shine overlay (left reflection, clipped)
  ctx.save();
  outline(ctx); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fillRect(W*0.06, H*0.04, W*0.07, H*0.50);
  ctx.restore();

  // 5. Extra (e.g. mug handle)
  if (extra) extra(ctx, THEME);

  return cv;
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  document.getElementById('mc').textContent = moves;

  tubes.forEach((tube, idx) => {
    const slot = document.createElement('div');
    slot.className = 'vslot' + (selected===idx?' sel':'') + (isTubeComplete(tube)?' done':'');
    slot.appendChild(drawVessel(tube, idx));
    slot.addEventListener('click', () => handleClick(idx));
    grid.appendChild(slot);
  });
}

// ─── POUR CANVAS ─────────────────────────────────────────────────────────────
const pourCv = document.getElementById('pourCv');
const pourCtx = pourCv.getContext('2d');
let pours = [], rafId = null;

function resizePour() { pourCv.width = window.innerWidth; pourCv.height = window.innerHeight; }
resizePour();
window.addEventListener('resize', resizePour);

class Pour {
  constructor(fR, tR, color, onDone) {
    this.color = color; this.onDone = onDone; this.done = false;
    this.f = 0; this.N = 48; this.alpha = 1; this.splashed = false;
    this.sx = fR.left + fR.width/2; this.sy = fR.top + fR.height * 0.1;
    this.dx = tR.left + tR.width/2; this.dy = tR.top + tR.height * 0.08;
    const mx = (this.sx+this.dx)/2;
    const lift = Math.max(24, Math.abs(this.dx-this.sx)*.28+16);
    this.c1x = this.sx+(mx-this.sx)*.5; this.c1y = Math.min(this.sy,this.dy)-lift;
    this.c2x = this.dx+(mx-this.dx)*.5; this.c2y = Math.min(this.sy,this.dy)-lift*.5;
    this.pts = [];
  }
  bez(t) {
    const u=1-t;
    return {
      x: u*u*u*this.sx+3*u*u*t*this.c1x+3*u*t*t*this.c2x+t*t*t*this.dx,
      y: u*u*u*this.sy+3*u*u*t*this.c1y+3*u*t*t*this.c2y+t*t*t*this.dy,
    };
  }
  update() {
    this.f++;
    const p = this.f/this.N;
    const head = Math.min(p*1.1,1), tail = Math.max(0,p-.48);
    if (p < .88) {
      for (let i=0;i<4;i++) {
        const t = tail+Math.random()*(head-tail);
        const pos = this.bez(Math.min(t,1));
        this.pts.push({x:pos.x+(Math.random()-.5),y:pos.y+(Math.random()-.5),
          vx:(Math.random()-.5)*.4,vy:.2+Math.random()*.35,
          r:2+Math.random()*2.5,life:1,dec:.05+Math.random()*.02,sp:false});
      }
    }
    if (p>=.42&&!this.splashed) {
      this.splashed=true;
      for (let i=0;i<12;i++) {
        const a=Math.PI+(Math.random()-.5)*Math.PI*.8;
        const spd=.6+Math.random()*2;
        this.pts.push({x:this.dx,y:this.dy,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-1,
          r:1.5+Math.random()*2,life:1,dec:.06+Math.random()*.025,sp:true});
      }
    }
    if (p>.70) this.alpha = Math.max(0,1-(p-.70)/.30);
    if (this.f>=this.N) { this.done=true; this.onDone&&this.onDone(); }
    for (const p of this.pts) {
      p.x+=p.vx; p.y+=p.vy; p.vy+=p.sp?.25:.14; p.life-=p.dec;
    }
    this.pts = this.pts.filter(p=>p.life>0);
  }
  draw(ctx) {
    const p=this.f/this.N;
    const head=Math.min(p*1.1,1),tail=Math.max(0,p-.50);
    if (p<1) {
      ctx.save();
      for (let i=0;i<28;i++) {
        const t0=tail+(head-tail)*(i/28), t1=tail+(head-tail)*((i+1)/28);
        if(t0>=1) break;
        const p0=this.bez(t0),p1=this.bez(Math.min(t1,1));
        ctx.globalAlpha=this.alpha*.88*(1-i/28*.1);
        ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);
        ctx.strokeStyle=this.color;ctx.lineWidth=Math.max(.7,4-i/28*2.5);
        ctx.lineCap='round';ctx.stroke();
      }
      ctx.restore();
    }
    ctx.save();
    for (const pt of this.pts) {
      ctx.globalAlpha=pt.life*this.alpha*.80;
      ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2);
      ctx.fillStyle=this.color;ctx.fill();
    }
    ctx.restore();
  }
}

function pourLoop() {
  pourCtx.clearRect(0,0,pourCv.width,pourCv.height);
  for (const p of pours) { p.update(); p.draw(pourCtx); }
  pours = pours.filter(p=>!p.done);
  if (pours.length>0) rafId=requestAnimationFrame(pourLoop);
  else rafId=null;
}
function startPour(fromEl, toEl, color) {
  pours.push(new Pour(fromEl.getBoundingClientRect(), toEl.getBoundingClientRect(), color, ()=>{}));
  if (!rafId) rafId=requestAnimationFrame(pourLoop);
}

// ─── GAME LOGIC ───────────────────────────────────────────────────────────────
function handleClick(idx) {
  if (isAnimating) return;
  if (selected===null) {
    if (!tubes[idx].length || isTubeComplete(tubes[idx])) return;
    selected=idx; render();
  } else {
    if (selected===idx) { selected=null; render(); return; }
    tryMove(selected, idx);
  }
}

function tryMove(from, to) {
  const src=tubes[from], dst=tubes[to];
  if (!src.length) { selected=null; render(); return; }
  if (dst.length>=CAP) { toast('Naczynie jest pełne!'); selected=null; render(); return; }
  const topColor=src[src.length-1];
  if (dst.length && dst[dst.length-1]!==topColor) { toast('Różne kolory!'); selected=null; render(); return; }

  let count=0;
  for (let i=src.length-1;i>=0;i--) {
    if (src[i]===topColor && dst.length+count<CAP) count++;
    else break;
  }

  history.push(JSON.parse(JSON.stringify(tubes)));
  const slots = document.querySelectorAll('.vslot');
  const fromEl=slots[from], toEl=slots[to];
  const color = PALETTE[topColor];

  isAnimating=true;

  const fromCv = fromEl?.querySelector('canvas');
  if (fromCv) {
    const isLeft = fromEl.getBoundingClientRect().left > (toEl?.getBoundingClientRect().left||0);
    fromCv.style.transition='transform .20s cubic-bezier(.34,1.2,.64,1)';
    fromCv.style.transformOrigin = isLeft ? 'bottom right' : 'bottom left';
    fromCv.style.transform = `rotate(${isLeft?-24:24}deg) translateY(-5px)`;
  }

  setTimeout(()=>{ if(fromEl&&toEl) startPour(fromEl,toEl,color); }, 140);

  setTimeout(()=>{
    if (fromCv) { fromCv.style.transition='transform .20s ease'; fromCv.style.transform=''; }
    for (let i=0;i<count;i++) dst.push(src.pop());
    moves++; selected=null; isAnimating=false;
    render(); checkWin();
  }, 620);
}

function isTubeComplete(tube) {
  return tube.length===CAP && tube.every(c=>c===tube[0]);
}
function checkWin() {
  if (tubes.filter(t=>t.length).every(t=>isTubeComplete(t))) {
    completedLevels.add(currentLevel);
    setTimeout(showWin, 450);
  }
}
function undoMove() {
  if (!history.length) { toast('Nie ma czego cofnąć!'); return; }
  tubes=history.pop(); moves=Math.max(0,moves-1); selected=null; render();
}

// ─── LEVEL ────────────────────────────────────────────────────────────────────
function generateLevel(cc, et) {
  let balls=[];
  for (let c=0;c<cc;c++) for (let i=0;i<CAP;i++) balls.push(c);
  for (let i=balls.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1)); [balls[i],balls[j]]=[balls[j],balls[i]];
  }
  const r=[];
  for (let i=0;i<cc;i++) r.push(balls.slice(i*CAP,(i+1)*CAP));
  for (let i=0;i<et;i++) r.push([]);
  return r;
}
function startLevel(lvl) {
  currentLevel=lvl;
  const [cc,et]=LEVELS[lvl]||[4,2];
  tubes=generateLevel(cc,et); moves=0; selected=null; history=[];
  document.getElementById('ldisp').textContent=lvl+1;
  document.getElementById('lbadge').textContent=`Poziom ${lvl+1}`;
  document.getElementById('win').classList.remove('on');
  render();
}

// ─── WIN ──────────────────────────────────────────────────────────────────────
function showWin() {
  document.getElementById('wm').textContent=moves;
  document.getElementById('win').classList.add('on');
  const c=document.getElementById('cfx'); c.innerHTML='';
  const cols=PALETTE;
  for (let i=0;i<90;i++) {
    const p=document.createElement('div'); p.className='cp';
    p.style.cssText=`left:${Math.random()*100}vw;background:${cols[~~(Math.random()*cols.length)]};
      width:${5+Math.random()*8}px;height:${7+Math.random()*10}px;
      border-radius:${Math.random()>.5?'50%':'4px'};
      animation:cfal ${1.2+Math.random()*1.8}s linear ${Math.random()*.8}s forwards;
      transform:rotate(${Math.random()*360}deg);`;
    c.appendChild(p);
  }
}

// ─── LEVEL SELECT ─────────────────────────────────────────────────────────────
function buildLvlSelect() {
  ['lg1','lg2','lg3'].forEach((id,gi)=>{
    const g=document.getElementById(id); g.innerHTML='';
    for (let i=gi*10;i<(gi+1)*10;i++) {
      const b=document.createElement('button');
      b.className='lbtn'+(i===currentLevel?' cur':'')+(completedLevels.has(i)?' donel':'');
      b.textContent=i+1;
      b.addEventListener('click',()=>{ startLevel(i); document.getElementById('lsel').classList.remove('on'); });
      g.appendChild(b);
    }
  });
}

// ─── CUSTOMIZER ───────────────────────────────────────────────────────────────
function buildShapeSwatches() {
  const cont=document.getElementById('shapeOpts'); cont.innerHTML='';
  SHAPE_KEYS.forEach(key=>{
    const sh=SHAPES[key], vd=sh.build(26);
    const div=document.createElement('div');
    div.className='shsw'+(key===C.shape?' on':'');

    const PAD=5, pw=vd.W+PAD*2, ph=vd.H+PAD*2;
    const c2=document.createElement('canvas');
    c2.width=pw*DPR; c2.height=ph*DPR;
    c2.style.width=pw+'px'; c2.style.height=ph+'px';
    const x=c2.getContext('2d'); x.scale(DPR,DPR); x.translate(PAD,PAD);
    x.fillStyle=THEME.surface; vd.outline(x); x.fill();
    x.strokeStyle=THEME.border; x.lineWidth=2; vd.outline(x); x.stroke();
    x.save(); vd.outline(x); x.clip();
    x.fillStyle='rgba(255,255,255,.15)'; x.fillRect(vd.W*.05,0,vd.W*.06,vd.H*.6);
    x.restore();

    const lbl=document.createElement('span'); lbl.textContent=sh.label;
    div.appendChild(c2); div.appendChild(lbl);
    div.addEventListener('click',()=>{
      C.shape=key; clearVCache();
      document.querySelectorAll('.shsw').forEach(e=>e.classList.remove('on'));
      div.classList.add('on'); render();
    });
    cont.appendChild(div);
  });
}

// BG
document.querySelectorAll('.bgsw').forEach(el=>el.addEventListener('click',()=>{
  document.querySelectorAll('.bgsw').forEach(e=>e.classList.remove('on'));
  el.classList.add('on');
  applyTheme(el.dataset.bg);
  clearVCache(); render();
}));

// Size
const szSl=document.getElementById('szSl'), szV=document.getElementById('szV');
szSl.addEventListener('input',()=>{
  C.size=+szSl.value; szV.textContent=C.size; clearVCache(); render();
});

document.getElementById('custBtn').addEventListener('click',()=>{ buildShapeSwatches(); document.getElementById('cust').classList.add('open'); });
document.getElementById('custClose').addEventListener('click',()=>document.getElementById('cust').classList.remove('open'));
document.getElementById('rstBtn').addEventListener('click',()=>startLevel(currentLevel));
document.getElementById('undoBtn').addEventListener('click',undoMove);
document.getElementById('replayBtn').addEventListener('click',()=>{ document.getElementById('win').classList.remove('on'); startLevel(currentLevel); });
document.getElementById('nextBtn').addEventListener('click',()=>startLevel(Math.min(currentLevel+1,29)));
document.getElementById('lvlBtn').addEventListener('click',()=>{ buildLvlSelect(); document.getElementById('lsel').classList.add('on'); });
document.getElementById('lsClose').addEventListener('click',()=>document.getElementById('lsel').classList.remove('on'));

function toast(msg) {
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),1800);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
applyTheme('light');
startLevel(0);
</script>
</body>
</html>
