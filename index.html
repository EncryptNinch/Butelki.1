<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockStack – Ultimate Inversion</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap');

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #F5F3EF; --surface: #FFFFFF; --border: #E8E4DC;
            --text: #1A1A2E; --text2: #8A8A9A; --accent: #FF5A5F; --accent2: #FFB347;
            --block-h: 38px; --tower-w: 75px; --tower-h: 220px;
        }

        body.bg-forest { background: radial-gradient(circle, #065f46 0%, #064e3b 100%); --surface: rgba(255,255,255,0.15); --border: rgba(255,255,255,0.3); --text: #f0fdf4; }
        body.bg-ocean  { background: radial-gradient(circle, #075985 0%, #0c4a6e 100%); --surface: rgba(255,255,255,0.15); --border: rgba(255,255,255,0.3); --text: #f0f9ff; }
        body.bg-sunset { background: radial-gradient(circle, #9a3412 0%, #7c2d12 100%); --surface: rgba(255,255,255,0.15); --border: rgba(255,255,255,0.3); --text: #fff7ed; }
        body.bg-rose   { background: radial-gradient(circle, #9f1239 0%, #881337 100%); --surface: rgba(255,255,255,0.15); --border: rgba(255,255,255,0.3); --text: #fff1f2; }
        body.cosmos    { --bg: #020617; --surface: rgba(15,23,42,0.8); --border: #1E3A5F; --text: #E2E8F0; --accent: #818CF8; }
        body.cosmos.bg-nebula { background: radial-gradient(circle, #4338ca 0%, #020617 100%); }
        body.cosmos.bg-void   { background: radial-gradient(circle, #111827 0%, #000000 100%); }
        body.cosmos.bg-aurora { background: radial-gradient(circle, #065f46 0%, #020617 100%); }
        body.cosmos.bg-mars   { background: radial-gradient(circle, #7c2d12 0%, #020617 100%); }

        body::before {
            content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background-image: radial-gradient(circle, rgba(0,0,0,0.04) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        body { font-family: 'Space Grotesk', sans-serif; background: var(--bg); color: var(--text); height: 100vh; margin: 0; display: flex; flex-direction: column; overflow: hidden; transition: background 0.5s ease, color 0.3s; }

        header { display: flex; align-items: center; justify-content: space-between; padding: 15px 25px; background: var(--surface); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); z-index: 100; flex-shrink: 0; }
        .logo { font-family: 'Space Mono', monospace; font-weight: 900; color: var(--text); letter-spacing: -0.5px; }
        .logo span { color: var(--accent); }
        .stat-pill { background: var(--bg); border: 2px solid var(--border); padding: 4px 14px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; color: var(--text2); }
        .stat-pill b { display: block; font-size: .95rem; font-weight: 900; color: var(--text); margin-top: 1px; }

        #gravity-bar { display: none; justify-content: center; align-items: center; gap: 12px; padding: 10px; background: var(--surface); border-bottom: 1px solid var(--border); }
        #gravity-bar.show { display: flex; }
        .g-pips { display: flex; gap: 6px; }
        .g-pip { width: 45px; height: 6px; border-radius: 3px; background: var(--border); transition: 0.4s cubic-bezier(0.4,0,0.2,1); }
        .g-pip.active { background: var(--accent); box-shadow: 0 0 10px var(--accent); }

        .lvlbadge {
            font-family: 'Space Mono', monospace;
            font-size: .75rem; font-weight: 900;
            letter-spacing: 2.5px; text-transform: uppercase;
            color: var(--text2);
            padding: 5px 18px;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 999px;
            margin: 0 auto;
        }

        main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; overflow: hidden; padding: 20px; }
        #grid { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 40px; padding: 20px; margin: auto; }

        .tower {
            width: var(--tower-w); height: var(--tower-h);
            background: var(--surface); border: 2px solid var(--border);
            border-radius: 18px; cursor: pointer;
            display: flex; flex-direction: row;
            padding: 10px 8px 10px 4px;
            position: relative; gap: 6px;
            transition: transform 0.8s cubic-bezier(0.68,-0.55,0.27,1.55), border-color 0.3s, box-shadow 0.3s;
        }
        .tower.selected { border-color: var(--accent); box-shadow: 0 0 25px var(--accent); }
        .tower.done     { border-color: #22C55E; box-shadow: 0 0 15px rgba(34,197,94,0.3); }
        .tower.full:not(.done):not(.selected) { border-color: rgba(239,68,68,0.6); box-shadow: 0 0 12px rgba(239,68,68,0.2); }
        .tower.full:not(.done):not(.selected) .tower-dot.filled { background: #EF4444; }

        /* Wskaźnik pojemności — 4 kropki po lewej, zawsze symetryczne */
        .tower-dots {
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; gap: 4px; flex-shrink: 0; width: 6px;
        }
        .tower-dot {
            width: 5px; height: 5px; border-radius: 50%;
            background: var(--border); transition: background .25s, transform .25s;
            flex-shrink: 0;
        }
        .tower-dot.filled { background: var(--accent); transform: scale(1.15); }
        .tower.full:not(.done):not(.selected) .tower-dot.filled { background: #EF4444; }
        .tower.done .tower-dot.filled { background: #22C55E; }

        .tower.shape-round { border-radius: 50px 50px 30px 30px; }
        .tower.shape-glass { border-radius: 8px 8px 20px 20px; }
        .tower.shape-mug { border-radius: 8px 8px 20px 20px; }
        .tower.shape-flask { border-radius: 30px 30px 50px 50px; }
        .tower.shape-shot { border-radius: 6px 6px 15px 15px; }
        .tower.shape-wineglass { border-radius: 50px 50px 10px 10px; }

        .tower-inner { flex: 1; display: flex; gap: 4px; width: 100%; height: 100%; }
        .block { width: 100%; height: var(--block-h); border-radius: 10px; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2); flex-shrink: 0; }

        .particle { position: fixed; pointer-events: none; width: 6px; height: 6px; z-index: 10000; animation: p-explosion 0.6s ease-out forwards; }
        @keyframes p-explosion { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }

        /* ── CUSTOMIZER ── */
        #cust {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
            background: var(--surface);
            border-top: 2px solid var(--border);
            border-radius: 24px 24px 0 0;
            box-shadow: 0 -8px 40px rgba(0,0,0,0.10);
            padding: 16px 20px 28px;
            transform: translateY(100%);
            transition: transform .32s cubic-bezier(.34,1.2,.64,1);
            max-height: 72vh; overflow-y: auto;
        }
        #cust.open { transform: translateY(0); }
        .cust-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .cust-title { font-family: 'Space Grotesk', sans-serif; font-size: 1.15rem; font-weight: 900; color: var(--text); }
        .cust-section { margin-bottom: 16px; }
        .cust-label {
            font-size: .6rem; font-weight: 800; letter-spacing: 1.5px;
            text-transform: uppercase; color: var(--text2); margin-bottom: 10px;
        }

        .bgsw {
            width: 60px; height: 40px; border-radius: 10px; cursor: pointer;
            border: 2.5px solid transparent; transition: .18s all;
            position: relative; overflow: hidden; flex-shrink: 0;
        }
        .bgsw.on { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,90,95,.2); }
        .bgsw:hover { transform: scale(1.06); }
        .bgsw span {
            position: absolute; bottom: 2px; left: 0; right: 0;
            text-align: center; font-size: .52rem; font-weight: 800;
            color: rgba(255,255,255,.95); text-shadow: 0 1px 3px rgba(0,0,0,.6);
        }

        .shsw {
            width: 54px; border-radius: 12px; cursor: pointer;
            padding: 8px 5px 6px;
            border: 2.5px solid var(--border); background: var(--bg);
            transition: .18s all;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
        }
        .shsw.on { border-color: var(--accent); background: rgba(255,90,95,.06); }
        .shsw:hover { border-color: #ccc; }
        .shsw span { font-size: .54rem; font-weight: 700; color: var(--text2); }

        .slrow { display: flex; align-items: center; gap: 12px; }
        input[type=range] {
            -webkit-appearance: none; flex: 1; height: 6px;
            border-radius: 3px; background: var(--border); outline: none; cursor: pointer;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
            background: var(--accent); box-shadow: 0 2px 8px rgba(255,90,95,.4); cursor: pointer;
        }
        .slv { font-weight: 800; font-size: .8rem; min-width: 28px; text-align: right; color: var(--text2); }

        .palette-swatch {
            display: flex; gap: 3px; flex-wrap: wrap; width: 60px; height: 40px;
            border-radius: 8px; overflow: hidden; cursor: pointer;
            border: 2.5px solid transparent; transition: .18s; padding: 3px;
            background: rgba(0,0,0,.04);
        }
        .palette-swatch.on { border-color: var(--accent); }
        .palette-swatch:hover { transform: scale(1.06); }
        .palette-swatch div { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }

        /* ── LEVEL MENU ── */
        .overlay { position: fixed; inset: 0; background: rgba(2,6,23,0.95); backdrop-filter: blur(10px); display: none; z-index: 1000; flex-direction: column; align-items: center; justify-content: flex-start; color: white; overflow-y: auto; padding: 32px 20px 40px; gap: 0; }
        .overlay.open { display: flex; }

        .lmenu-title { font-family: 'Space Mono', monospace; font-size: 1.1rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 24px; }
        .lmenu-section { width: 100%; max-width: 400px; margin-bottom: 20px; }
        .lmenu-section-label { font-size: .65rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #64748B; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .lmenu-section-label::after { content: ''; flex: 1; height: 1px; background: #1E293B; }
        .lmenu-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }

        .lvl-btn {
            aspect-ratio: 1; border-radius: 10px; cursor: pointer;
            background: rgba(255,255,255,.06); border: 1.5px solid rgba(255,255,255,.1);
            color: #94A3B8; font-weight: 700; font-size: .82rem;
            transition: .18s; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 2px;
            position: relative;
        }
        .lvl-btn:hover  { background: rgba(99,102,241,.2); border-color: #6366F1; color: #fff; }
        .lvl-btn.current { background: #6366F1; border-color: #6366F1; color: #fff; }
        .lvl-btn.done   { border-color: #22C55E; color: #22C55E; }
        .lvl-btn.done::after { content: '✓'; position: absolute; top: 4px; right: 6px; font-size: .55rem; color: #22C55E; }
        .lvl-btn.done::after { content: '✓'; position: absolute; top: 4px; right: 6px; font-size: .55rem; color: #22C55E; }

        /* ── LEVEL SELECT ───────────────────────────────────────────────────────── */
        #lsel {
            display: none; position: fixed; inset: 0;
            background: rgba(2,6,23,.88); backdrop-filter: blur(10px);
            z-index: 1000; flex-direction: column; align-items: center;
            justify-content: flex-start; gap: 14px; overflow-y: auto; padding: 28px 16px;
        }
        #lsel.on { display: flex; }

        .lsec { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; max-width: 400px; }
        .lsec-label {
            font-size: .6rem; font-weight: 800; letter-spacing: 1.5px;
            text-transform: uppercase; color: #64748B; align-self: flex-start;
        }
        .lgrid { display: grid; grid-template-columns: repeat(6,1fr); gap: 7px; width: 100%; }

        /* ── WIN BANNER (nie fullscreen — wbudowany w grę) ── */
        #win {
            position: fixed; bottom: -120px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 32px); max-width: 520px;
            background: var(--surface); border: 1.5px solid var(--border);
            border-radius: 20px; box-shadow: 0 -4px 40px rgba(0,0,0,0.18);
            backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 20px; gap: 14px;
            z-index: 1000; transition: bottom .45s cubic-bezier(.34,1.3,.64,1);
        }
        #win.open { bottom: 20px; }
        .win-left { display: flex; align-items: center; gap: 12px; }
        .win-icon { font-size: 2rem; line-height: 1; }
        .win-text { display: flex; flex-direction: column; gap: 1px; }
        .win-title { font-family: 'Space Mono', monospace; font-weight: 700; font-size: .9rem; letter-spacing: 1px; color: var(--text); }
        .win-sub { font-size: .75rem; color: var(--text); opacity: .5; }
        .win-moves { font-family: 'Space Mono', monospace; font-size: 1.6rem; font-weight: 700; color: var(--accent); min-width: 42px; text-align: center; }
        .win-btns { display: flex; gap: 8px; flex-shrink: 0; }

        .btn { padding: 8px 16px; border-radius: 12px; border: none; cursor: pointer; font-weight: 700; transition: 0.15s all; font-family: 'Space Grotesk', sans-serif; font-size: .82rem; }
        .btn:active { transform: scale(.93); }
        .btn-primary { background: var(--accent); color: white; box-shadow: 0 4px 14px rgba(255,90,95,.35); }
        .btn-primary:hover { box-shadow: 0 6px 20px rgba(255,90,95,.5); transform: translateY(-1px); }
        .btn-ghost { background: var(--surface); color: var(--text); border: 2px solid var(--border); }
        .btn-ghost:hover { background: var(--bg); border-color: #d0ccc4; }

        .toast {
            position: fixed; bottom: 90px; left: 50%;
            transform: translateX(-50%) translateY(60px);
            background: var(--text); color: #fff;
            border-radius: 999px; padding: 9px 22px;
            font-weight: 700; font-size: .85rem;
            z-index: 200; transition: transform .28s cubic-bezier(.34,1.56,.64,1);
            pointer-events: none; white-space: nowrap;
        }
        .toast.on { transform: translateX(-50%) translateY(0); }

        .cfx { position: fixed; inset: 0; pointer-events: none; z-index: 999; overflow: hidden; }
        .cp  { position: absolute; top: -20px; animation: cfal linear forwards; }
        @keyframes cfal { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
    </style>
</head>
<body class="bg-default">

<header>
    <div class="logo">Block<span>Sort</span></div>
    <div style="display:flex; gap:12px">
        <div class="stat-pill">Ruchy: <b id="moves">0</b></div>
        <div class="stat-pill">Poziom: <b id="lvl-num">1</b></div>
    </div>
    <div style="display:flex; gap:8px;">
        <button class="btn btn-ghost" onclick="undoMove()">↩</button>
        <button class="btn btn-ghost" id="lvlBtn">📋</button>
        <button class="btn btn-ghost" id="custBtn">🎨</button>
        <button class="btn btn-primary" onclick="init(currentLevel)">↺</button>
    </div>
</header>

<div class="lvlbadge" id="lbadge" style="text-align:center;">Poziom 1</div>

<div id="gravity-bar">

</div>

<main><div id="grid"></div></main>

<canvas id="pourCv" style="position:fixed;top:0;left:0;pointer-events:none;z-index:30;"></canvas>

<!-- CUSTOMIZER -->
<div id="cust">
    <div class="cust-header">
        <div class="cust-title">✨ Wygląd</div>

    <div class="cust-section">

        </div>

    <div class="cust-section">
        <div class="cust-label">🧪 Kształt naczynia</div>

    <div class="cust-section">
        <div class="cust-label">📐 Rozmiar</div>

    <div class="cust-section">
        <div class="cust-label">🎨 Kolory bloków</div>
        <div id="paletteOpts" style="display:flex; gap:10px; flex-wrap:wrap;"></div>
    </div>

    <button class="btn btn-primary" onclick="closeAllOverlays()" style="width:100%; margin-top:4px;">ZAMKNIJ</button>
</div>

<!-- LEVEL MENU -->
<div id="lmenu" class="overlay">
    <div class="lmenu-title">📋 Mission Modules</div>
    <div class="lmenu-section">
        <div class="lmenu-section-label">🌍 Earth (1–10)</div>
        <div class="lmenu-grid" id="lgEarth"></div>
    </div>
    <div class="lmenu-section">
        <div class="lmenu-section-label">🌌 Cosmos (11–20)</div>
        <div class="lmenu-grid" id="lgCosmos"></div>
    </div>
    <button class="btn btn-primary" onclick="closeAllOverlays()" style="margin-top:8px;">BACK</button>
</div>

<!-- LEVEL SELECT -->
<div id="lsel" class="overlay">
    <div class="lmenu-title">Wybierz poziom</div>
    <div class="lsec"><div class="lsec-label">Łatwe (1–10)</div><div class="lgrid" id="lg1"></div></div>
    <div class="lsec"><div class="lsec-label">Średnie (11–20)</div><div class="lgrid" id="lg2"></div></div>
    <div class="lsec"><div class="lsec-label">Trudne (21–30)</div><div class="lgrid" id="lg3"></div></div>
    <button class="btn btn-primary" onclick="closeAllOverlays()" style="margin-top:8px;">BACK</button>
</div>

<!-- WIN BANNER -->
<div id="win">
    <div class="cfx" id="cfx"></div>
    <div class="win-left">
        <div class="win-icon">🎉</div>
        <div class="win-text">
            <div class="win-title">LEVEL COMPLETE!</div>
            <div class="win-sub">Solved in <span id="winMoves">0</span> moves</div>
        </div>
    </div>
    <div class="win-moves" id="winMovesLarge">0</div>
    <div class="win-btns">
        <button class="btn btn-ghost" style="padding:10px 14px;" onclick="init(currentLevel)">↺</button>
        <button class="btn btn-primary" id="nextBtn">Next →</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

// ─── PALETTE & LEVELS ──────────────────────────────────────────────────────────
const PALETTE = [
    '#FF5A5F', '#3B82F6', '#22C55E', '#F59E0B', '#A855F7', '#F97316',
    '#EC4899', '#06B6D4', '#84CC16', '#EF4444', '#8B5CF6', '#14B8A6',
];

const CAP = 4;
const LEVELS = [
    [3,2],[3,2],[4,2],[4,2],[4,2],
    [5,2],[5,2],[5,2],[5,2],[6,2],
    [6,2],[6,2],[6,3],[6,3],[7,2],
    [7,2],[7,3],[7,3],[8,2],[8,3],
    [8,3],[9,2],[9,3],[9,3],[10,2],
    [10,3],[10,3],[11,3],[11,3],[12,3],
];

// ─── BACKGROUNDS ─────────────────────────────────────────────────────────────
const BG_THEMES = {
    light: { bg:'#F5F3EF', dot:'rgba(0,0,0,0.04)', text:'#1A1A2E', text2:'#8A8A9A', surface:'#FFFFFF', border:'#E8E4DC', accent:'#FF5A5F' },
    dark:  { bg:'#14141F', dot:'rgba(255,255,255,0.04)', text:'#F0F0F0', text2:'#6B6B80', surface:'#1E1E2E', border:'#2A2A3E', accent:'#FF5A5F' },
    blue:  { bg:'#EFF6FF', dot:'rgba(59,130,246,0.06)', text:'#1E3A5F', text2:'#6B90B0', surface:'#FFFFFF', border:'#BFDBFE', accent:'#3B82F6' },
    green: { bg:'#F0FDF4', dot:'rgba(34,197,94,0.06)', text:'#14532D', text2:'#6B9E7A', surface:'#FFFFFF', border:'#BBF7D0', accent:'#22C55E' },
    peach: { bg:'#FFF7ED', dot:'rgba(249,115,22,0.06)', text:'#7C2D12', text2:'#B07A5A', surface:'#FFFFFF', border:'#FED7AA', accent:'#F97316' },
};

// ─── PALETTES ─────────────────────────────────────────────────────────────────
const PALETTES = {
    standard: ['#6366F1','#10B981','#F59E0B','#EF4444','#8B5CF6','#06B6D4','#F472B6','#94A3B8'],

function applyTheme(bgKey) {
    if (BG_THEMES[bgKey]) {
        const t = BG_THEMES[bgKey];
        const r = document.documentElement.style;
        r.setProperty('--bg', t.bg);
        r.setProperty('--surface', t.surface);
        r.setProperty('--border', t.border);
        r.setProperty('--text', t.text);
        r.setProperty('--text2', t.text2);
        r.setProperty('--accent', t.accent);
        currentBgId = bgKey;
        document.body.style.background = t.bg;
        document.body.style.backgroundImage = t.dot ? `radial-gradient(circle, ${t.dot} 1px, transparent 1px)` : 'none';
        document.body.style.backgroundSize = t.dot ? '24px 24px' : 'auto';
    } else {
        applyCosmosTheme(bgKey);
    }
}

function applyCosmosTheme(themeId) {
    const isCosmos = currentLevel >= 10;
    const themes = isCosmos ? COSMOS_THEMES : EARTH_THEMES;
    const theme = themes.find(t => t.id === themeId) || themes[0];
    const r = document.documentElement.style;
    r.setProperty('--surface', theme.surface);
    r.setProperty('--border', theme.border);
    r.setProperty('--text', theme.text);
    r.setProperty('--accent', theme.accent);
    document.body.style.background = theme.gradient !== 'none' ? theme.gradient : theme.bg;
    currentBgId = themeId;
}

// ─── STATE ────────────────────────────────────────────────────────────────────
let towers=[], history=[], selected=null, moves=0, currentLevel=0;
let gravityDir=0, gravityCounter=4, isAnimating=false;
let towerW=75, blockH=38, COLORS=[...PALETTE];
let currentBgId = 'light';
let currentShape = 'pill';
let C = { bg:'light', shape:'pill', size:52 };
const completedLevels = new Set();

// ─── INIT ─────────────────────────────────────────────────────────────────────
function init(lvl) {
    if (lvl > 29) lvl = 29;
    if (lvl < 0)  lvl = 0;
    currentLevel = lvl;

    const isCosmos = lvl >= 10;
    document.body.className = isCosmos ? 'cosmos' : '';
    
    const themes = isCosmos ? COSMOS_THEMES : EARTH_THEMES;
    const savedId = isCosmos ? (currentBgId || 'nebula') : (currentBgId || 'light');
    const theme = themes.find(t => t.id === savedId);
    if (theme) applyCosmosTheme(savedId);
    else applyTheme(currentBgId);

    document.getElementById('gravity-bar').className = isCosmos ? 'show' : '';
    
    const [cc, et] = LEVELS[lvl] || [4, 2];
    towers = generateLevel(cc, et);
    
    moves=0; gravityDir=0; gravityCounter=4; selected=null; history=[];
    document.getElementById('gArrow').style.transform = 'rotate(0deg)';
    closeAllOverlays();
    updateGravityUI();
    
    const badge = document.getElementById('lbadge');
    if (badge) badge.textContent = `Poziom ${lvl + 1}`;
    
    render();
}

function generateLevel(cc, et) {
    let balls=[];
    for(let c=0;c<cc;c++) for(let i=0;i<CAP;i++) balls.push(c);
    for(let i=balls.length-1; i>0; i--) {
        const j=Math.floor(Math.random()*(i+1));
        [balls[i], balls[j]] = [balls[j], balls[i]];
    }
    const r=[];
    for(let i=0;i<cc;i++) r.push(balls.slice(i*CAP, (i+1)*CAP));
    for(let i=0;i<et;i++) r.push([]);
    return r;
}

function setSize(w, h) {
    towerW=w; blockH=h;
    C.size = w;
    document.documentElement.style.setProperty('--tower-w', w+'px');
    document.documentElement.style.setProperty('--tower-h', (w*2.8)+'px');
    document.documentElement.style.setProperty('--block-h', h+'px');
    render();
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    towers.forEach((stack, i) => {
        const isFull = stack.length >= 4;
        const t = document.createElement('div');
        t.className = 'tower shape-' + currentShape
            + (selected===i ? ' selected' : '')
            + (isDone(stack)  ? ' done'     : '')
            + (isFull && !isDone(stack) ? ' full' : '');
        t.style.transform = `rotate(${gravityDir * 180}deg)`;

        const dots = document.createElement('div');
        dots.className = 'tower-dots';
        for (let d = 0; d < 4; d++) {
            const dot = document.createElement('div');
            dot.className = 'tower-dot' + (d < stack.length ? ' filled' : '');
            dots.appendChild(dot);
        }
        t.appendChild(dots);

        const inner = document.createElement('div');
        inner.className = 'tower-inner';
        inner.style.flexDirection = gravityDir === 0 ? 'column-reverse' : 'column';

        stack.forEach(c => {
            const b = document.createElement('div');
            b.className = 'block'; 
            b.style.background = COLORS[c % COLORS.length];
            inner.appendChild(b);
        });
        t.appendChild(inner);

        t.onclick = () => {
            if (isAnimating) return;
            if (selected === null) { if (towers[i].length && !isDone(stack)) { selected = i; render(); } }
            else { if (selected === i) { selected = null; render(); } else tryMove(selected, i); }
        };
        grid.appendChild(t);
    });
    document.getElementById('moves').textContent   = moves;
    document.getElementById('lvl-num').textContent = currentLevel + 1;
}

// ─── MOVE ─────────────────────────────────────────────────────────────────────
async function tryMove(from, to) {
    const src=towers[from], dst=towers[to];
    if (!src.length) { selected=null; render(); return; }
    if (dst.length>=CAP) { toast('Naczynie jest pełne!'); selected=null; render(); return; }
    const topColor=src[src.length-1];
    if (dst.length && dst[dst.length-1]!==topColor) { toast('Różne kolory!'); selected=null; render(); return; }

    let count=0;
    for(let i=src.length-1;i>=0;i--) {
        if(src[i]===topColor && dst.length+count<CAP) count++;
        else break;
    }

    history.push(JSON.parse(JSON.stringify(towers)));
    isAnimating=true;

    const towerEls = document.querySelectorAll('.tower');
    const fR = towerEls[from].getBoundingClientRect();
    const tR = towerEls[to].getBoundingClientRect();
    const dCount = dst.length;

    const color = COLORS[topColor % COLORS.length];

    for(let i=0;i<count;i++) src.pop();
    render();

    await animatePour(fR, tR, color, count, dCount);

    for(let i=0;i<count;i++) dst.push(topColor);
    moves++; selected=null;

    if(currentLevel>=10) {
        gravityCounter--;
        updateGravityUI();
        if(gravityCounter<=0) await triggerFlip();
    }

    isAnimating=false;
    render();
    if(towers.every(t=>t.length===0||isDone(t))) showWin();
}

// ─── POUR CANVAS ─────────────────────────────────────────────────────────────
const pourCv = document.getElementById('pourCv');
const pourCtx = pourCv.getContext('2d');
let pours = [], rafId = null;

function resizePour() { pourCv.width = window.innerWidth; pourCv.height = window.innerHeight; }
resizePour();
window.addEventListener('resize', resizePour);

class Pour {
    constructor(fR, tR, color, onDone) {
        this.color = color; this.onDone = onDone; this.done = false;
        this.f = 0; this.N = 48; this.alpha = 1; this.splashed = false;
        this.sx = fR.left + fR.width/2; this.sy = fR.top + fR.height * 0.1;
        this.dx = tR.left + tR.width/2; this.dy = tR.top + tR.height * 0.08;
        const mx = (this.sx+this.dx)/2;
        const lift = Math.max(24, Math.abs(this.dx-this.sx)*.28+16);
        this.c1x = this.sx+(mx-this.sx)*.5; this.c1y = Math.min(this.sy,this.dy)-lift;
        this.c2x = this.dx+(mx-this.dx)*.5; this.c2y = Math.min(this.sy,this.dy)-lift*.5;
        this.pts = [];
    }
    bez(t) {
        const u=1-t;
        return {
            x: u*u*u*this.sx+3*u*u*t*this.c1x+3*u*t*t*this.c2x+t*t*t*this.dx,
            y: u*u*u*this.sy+3*u*u*t*this.c1y+3*u*t*t*this.c2y+t*t*t*this.dy,
        };
    }
    update() {
        this.f++;
        const p = this.f/this.N;
        const head = Math.min(p*1.1,1), tail = Math.max(0,p-.48);
        if (p < .88) {
            for (let i=0;i<4;i++) {
                const t = tail+Math.random()*(head-tail);
                const pos = this.bez(Math.min(t,1));
                this.pts.push({x:pos.x+(Math.random()-.5),y:pos.y+(Math.random()-.5),
                    vx:(Math.random()-.5)*.4,vy:.2+Math.random()*.35,
                    r:2+Math.random()*2.5,life:1,dec:.05+Math.random()*.02,sp:false});
            }
        }
        if (p>=.42&&!this.splashed) {
            this.splashed=true;
            for (let i=0;i<12;i++) {
                const a=Math.PI+(Math.random()-.5)*Math.PI*.8;
                const spd=.6+Math.random()*2;
                this.pts.push({x:this.dx,y:this.dy,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-1,
                    r:1.5+Math.random()*2,life:1,dec:.06+Math.random()*.025,sp:true});
            }
        }
        if (p>.70) this.alpha = Math.max(0,1-(p-.70)/.30);
        if (this.f>=this.N) { this.done=true; this.onDone&&this.onDone(); }
        for (const p of this.pts) {
            p.x+=p.vx; p.y+=p.vy; p.vy+=p.sp?.25:.14; p.life-=p.dec;
        }
        this.pts = this.pts.filter(p=>p.life>0);
    }
    draw(ctx) {
        const p=this.f/this.N;
        const head=Math.min(p*1.1,1),tail=Math.max(0,p-.50);
        if (p<1) {
            ctx.save();
            for (let i=0;i<28;i++) {
                const t0=tail+(head-tail)*(i/28), t1=tail+(head-tail)*((i+1)/28);
                if(t0>=1) break;
                const p0=this.bez(t0),p1=this.bez(Math.min(t1,1));
                ctx.globalAlpha=this.alpha*.88*(1-i/28*.1);
                ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);
                ctx.strokeStyle=this.color;ctx.lineWidth=Math.max(.7,4-i/28*2.5);
                ctx.lineCap='round';ctx.stroke();
            }
            ctx.restore();
        }
        ctx.save();
        for (const pt of this.pts) {
            ctx.globalAlpha=pt.life*this.alpha*.80;
            ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2);
            ctx.fillStyle=this.color;ctx.fill();
        }
        ctx.restore();
    }
}

function pourLoop() {
    pourCtx.clearRect(0,0,pourCv.width,pourCv.height);
    for (const p of pours) { p.update(); p.draw(pourCtx); }
    pours = pours.filter(p=>!p.done);
    if (pours.length>0) rafId=requestAnimationFrame(pourLoop);
    else rafId=null;
}
function startPour(fromEl, toEl, color) {
    pours.push(new Pour(fromEl.getBoundingClientRect(), toEl.getBoundingClientRect(), color, ()=>{}));
    if (!rafId) rafId=requestAnimationFrame(pourLoop);
}

function delay(ms) { return new Promise(r=>setTimeout(r,ms)); }

// ─── ANIMATION ────────────────────────────────────────────────────────────────
async function animatePour(fR, tR, col, cnt, dCnt) {
    const ghost = document.createElement('div');
    ghost.style.cssText = `
        position:fixed; pointer-events:none; z-index:9999;
        width:${fR.width-20}px;
        display:flex; flex-direction:${gravityDir===0?'column-reverse':'column'}; gap:4px;
    `;
    for(let i=0;i<cnt;i++) {
        const b=document.createElement('div');
        b.style.cssText=`width:100%;height:${blockH}px;border-radius:8px;background:${col};box-shadow:inset 0 -4px 0 rgba(0,0,0,0.2);flex-shrink:0;`;
        ghost.appendChild(b);
    }
    document.body.appendChild(ghost);

    const startLeft   = fR.left + 10;
    const startBottom = window.innerHeight - fR.top + 4;
    ghost.style.left   = startLeft + 'px';
    ghost.style.bottom = startBottom + 'px';

    await delay(20);

    const liftAmt  = Math.max(80, Math.abs(tR.left - fR.left) * 0.35);
    const liftBottom = startBottom + liftAmt;
    ghost.style.transition = 'bottom .22s cubic-bezier(.4,0,.2,1)';
    ghost.style.bottom = liftBottom + 'px';
    await delay(240);

    ghost.style.transition = 'left .22s linear';
    ghost.style.left = (tR.left + 10) + 'px';
    await delay(240);

    const stackHeightAbove = dCnt * (blockH + 4);
    const endBottom = window.innerHeight - tR.bottom + 8 + stackHeightAbove;
    ghost.style.transition = 'bottom .22s cubic-bezier(.34,1.4,.64,1)';
    ghost.style.bottom = endBottom + 'px';
    await delay(240);

    startPour(
        { getBoundingClientRect: () => ({ left: fR.left + 10, top: fR.top, width: fR.width-20, height: blockH }) },
        { getBoundingClientRect: () => ({ left: tR.left + 10, top: tR.bottom - stackHeightAbove - blockH, width: tR.width-20, height: blockH }) },
        col
    );

    ghost.remove();
}

// ─── GRAVITY FLIP ────────────────────────────────────────────────────────────
async function triggerFlip() {
    isAnimating = true;
    toast('GRAVITY INVERSION!');
    gravityDir = gravityDir === 0 ? 1 : 0;
    gravityCounter = 4;

    document.getElementById('gArrow').style.transform = `rotate(${gravityDir * 180}deg)`;

    // Obróć wieże CSS-em
    document.querySelectorAll('.tower').forEach(t => {
        t.style.transform = `rotate(${gravityDir * 180}deg)`;
    });

    // Czekaj dokładnie tyle ile trwa CSS transition (800ms)
    await delay(820);

    // Logiczne odwrócenie danych
    towers = towers.map(t => [...t].reverse());
    updateGravityUI();

    // render() tworzy nowe elementy DOM — muszą od razu mieć właściwy transform
    // BEZ transition żeby nie było "skoku" z 0deg do 180deg
    render();
    document.querySelectorAll('.tower').forEach(t => {
        t.style.transition = 'none';
        t.style.transform  = `rotate(${gravityDir * 180}deg)`;
    });
    // Przywróć transition w następnej klatce
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            document.querySelectorAll('.tower').forEach(t => {
                t.style.transition = '';
            });
        });
    });

    isAnimating = false;
}

function updateGravityUI() {
    const pips=document.getElementById('gPips'); pips.innerHTML='';
    for(let i=0;i<4;i++) {
        const p=document.createElement('div');
        p.className='g-pip'+(i<(4-gravityCounter)?' active':'');
        pips.appendChild(p);
    }
}

    document.getElementById('winMoves').textContent = moves;
    document.getElementById('winMovesLarge').textContent = moves;
    document.getElementById('win').classList.add('open');
    spawnConfetti();

    if (currentLevel >= 29) {
        nextBtn.textContent = '🏆 Done!';
        nextBtn.onclick = () => closeAllOverlays();
    } else {
        nextBtn.textContent = 'Następny →';
        nextBtn.onclick = () => init(currentLevel + 1);
    }
}

function buildShapeSwatches() {
    const cont=document.getElementById('shapeOpts'); cont.innerHTML='';
    SHAPE_KEYS.forEach(key=>{
        const sh=SHAPES[key];
        const div=document.createElement('div');
        div.className='shsw'+(key===currentShape?' on':'');
        
        const icon = document.createElement('div');
        icon.style.cssText = 'font-size: 1.4rem;';
        icon.textContent = sh.emoji;
        
        const lbl = document.createElement('span'); lbl.textContent = sh.label;
        div.appendChild(icon); div.appendChild(lbl);
        
        div.addEventListener('click',()=>{
            currentShape = key;
            document.querySelectorAll('.shsw').forEach(e=>e.classList.remove('on'));
            div.classList.add('on');
            render();
        });
        cont.appendChild(div);
    });
}

function buildPaletteSwatches() {
    const pCont=document.getElementById('paletteOpts'); pCont.innerHTML='';
    Object.entries(PALETTES).forEach(([name, colors]) => {
        const wrap=document.createElement('div');
        wrap.className='palette-swatch'+(COLORS===colors?' on':'');

        colors.forEach(c => {
            const d=document.createElement('div'); d.style.background=c;
            wrap.appendChild(d);
        });
        const lbl=document.createElement('div');
        lbl.style.cssText='width:100%;font-size:.52rem;font-weight:800;text-align:center;color:var(--text);opacity:.5;margin-top:2px;text-transform:uppercase;';
        lbl.textContent=name;
        wrap.onclick=()=>{
            COLORS=[...colors]; render();
            document.querySelectorAll('.palette-swatch').forEach(s=>s.classList.remove('on'));
            wrap.classList.add('on');
        };
        pCont.appendChild(wrap);
    });
}

function buildBgSwatches() {
    document.querySelectorAll('.bgsw').forEach(el=>{
        el.classList.toggle('on', el.dataset.bg === currentBgId);
    });
}

// BG Theme
document.getElementById('bgOpts')?.addEventListener('click',(e)=>{

    document.querySelectorAll('.bgsw').forEach(s=>s.classList.remove('on'));
    el.classList.add('on');
    applyTheme(el.dataset.bg);

    });
}

// Cust close
document.getElementById('custClose').addEventListener('click',()=>{
    document.getElementById('cust').classList.remove('open');
});

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function isDone(s) { return s.length===CAP && s.every(c=>c===s[0]); }
function closeAllOverlays() {
    console.log('closeAllOverlays called');
    document.querySelectorAll('.overlay,#cust').forEach(e=>e.classList.remove('on','open'));
    document.getElementById('win').classList.remove('open');
}
function toast(m) { 
    const t=document.getElementById('toast'); 
    t.textContent=m; 
    t.classList.add('on'); 
    clearTimeout(t._t); 
    t._t=setTimeout(()=>t.classList.remove('on'),1800); 
}
function undoMove() { if(history.length&&!isAnimating){ towers=history.pop(); moves=Math.max(0,moves-1); render(); } }

// ─── START ────────────────────────────────────────────────────────────────────
applyTheme('light');
init(0);
</script>
